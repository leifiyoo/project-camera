version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # eslint-config-next still ships eslint-plugin-react 7 (no ESLint 10 support)
      # and typescript-eslint 8 (TypeScript <6.1 only). Revisit when they catch up.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
